# mise bootstrap の定義（~/.config/mise/conf.d/bootstrap.toml として配置される）
# 適用: mise bootstrap（任意のディレクトリから実行可）
# ドキュメント: https://mise.jdx.dev/bootstrap.html

# ------------------------------------------------------------
# dotfiles
# ------------------------------------------------------------

[dotfiles]
# ~/dotfiles/home 配下の git index にある（git add 済みの）ファイルを ~ に 1 ファイルずつ symlink する。
# dot-xxx は .xxx として展開される。管理外のファイル（~/.claude のランタイムデータ等）は残る。
"~" = { source = "~/dotfiles/home", mode = "symlink-each", dot_prefix = true, manifest = "git", exclude = [
  # アプリ自身が書き換えるファイルは下の copy エントリで管理する
  "dot-config/karabiner/karabiner.json",
  "dot-config/zed/settings.json",
  "dot-claude/settings.json",
  "Library/Application Support/Code/User/settings.json",
  "Library/Application Support/Cursor/User/settings.json",
] }

# アプリが書き換えると symlink が実ファイルに置き換わるため copy で配置する。
# アプリ側の変更をリポジトリに取り込むには `mise dot add --changed` を使う。
"~/.config/karabiner/karabiner.json" = { source = "~/dotfiles/home/dot-config/karabiner/karabiner.json", mode = "copy" }
"~/.config/karabiner" = { permissions = "0700" }
"~/.config/zed/settings.json" = { source = "~/dotfiles/home/dot-config/zed/settings.json", mode = "copy", permissions = "0600" }
"~/.claude/settings.json" = { source = "~/dotfiles/home/dot-claude/settings.json", mode = "copy" }
"~/Library/Application Support/Code/User/settings.json" = { source = "~/dotfiles/home/Library/Application Support/Code/User/settings.json", mode = "copy" }
"~/Library/Application Support/Cursor/User/settings.json" = { source = "~/dotfiles/home/Library/Application Support/Cursor/User/settings.json", mode = "copy" }

# ------------------------------------------------------------
# Git リポジトリ
# ------------------------------------------------------------

[bootstrap.repos]
# ref なしなので通常は現在のコミットのまま。更新は mise bootstrap --update
"~/.zprezto" = { url = "https://github.com/sorin-ionescu/prezto.git" }

[bootstrap.hooks]
# bootstrap.repos はサブモジュールを扱わないため、Prezto のサブモジュールはここで取得する
post-repos = 'git -C "$HOME/.zprezto" submodule update --init --recursive'

# ------------------------------------------------------------
# パッケージ（Homebrew formula / cask）
# ------------------------------------------------------------

[bootstrap.brew]
# 手動で入れた同名アプリがあれば置き換えずに引き継ぐ（置き換えると macOS の権限設定が外れることがある）
adopt = true

[bootstrap.packages]
# Homebrew で入れた cask は mise がインストール済みとして扱い更新しない（更新は brew upgrade --cask）
# CLI ツール
"brew:ripgrep" = "latest"
"brew:fd" = "latest"
"brew:bat" = "latest"
"brew:eza" = "latest"
"brew:zoxide" = "latest"
"brew:fzf" = "latest"
"brew:git-delta" = "latest"
"brew:jq" = "latest"
"brew:yq" = "latest"
"brew:gh" = "latest"
"brew:htop" = "latest"
"brew:tree" = "latest"
"brew:wget" = "latest"
"brew:curl" = "latest"
"brew:unzip" = "latest"
"brew:gzip" = "latest"
"brew:tldr" = "latest"
"brew:direnv" = "latest"
"brew:yt-dlp" = "latest"
"brew:vim" = "latest"
"brew:cmake" = "latest"
"brew:cocoapods" = "latest"
"brew:gcc" = "latest"
"brew:googleworkspace-cli" = "latest"
"brew:neovim" = "latest"

# GUI アプリ
"brew-cask:1password" = "latest"
"brew-cask:blender" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:jetbrains-toolbox" = "latest"
"brew-cask:karabiner-elements" = "latest"
"brew-cask:mactex-no-gui" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:tableplus" = "latest"
"brew-cask:unity-hub" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:wezterm@nightly" = "latest"
"brew-cask:zed" = "latest"

# ------------------------------------------------------------
# macOS defaults
# ------------------------------------------------------------
# Dock / Finder は再起動するまで反映されない: killall Dock Finder

[bootstrap.macos.dock]
autohide = false
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
show_extensions_warning = false

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllExtensions = true
QuitMenuItem = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
"com.apple.swipescrolldirection" = false

# ------------------------------------------------------------
# 宣言的に書けないセットアップ（毎回実行されるので冪等にしてある）
# ------------------------------------------------------------

[tasks.bootstrap]
description = "mise bootstrap の最後に実行される追加セットアップ"
hide = true
dir = "{{env.HOME}}"
run = 'bash "$HOME/dotfiles/scripts/post-bootstrap.sh"'
